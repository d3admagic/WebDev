<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>BYO Form</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <h1 id="title">Job Application</h1>

<form id="contractForm">

    <p class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required />
    </p>

    <p class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email" required />
    </p>

    <p class="form-group">
        <label for="position">Position Applied For:</label>
        <select id="position" required>
            <option value="">-- Select Position --</option>
            <option value="Web Designer">Web Designer</option>
        </select>
    </p>

    <p class="form-group">
        <label for="startDate">Available Start Date:</label>
        <input type="date" id="startDate" required />
    </p>

    <p class="form-group">
        <label>Work Status Preference:</label>
        <span class="radio-group">
            <label><input type="radio" name="workStatus" value="Full-Time" required /> Full-Time</label>
            <label><input type="radio" name="workStatus" value="Part-Time" /> Part-Time</label>
        </span>
    </p>

    <p class="form-group">
        <label for="experience">Relevant Work Experience:</label>
        <br>
        <textarea id="experience" placeholder="Briefly describe your background." rows="4"></textarea>
    </p>

        <button type="submit">Submit</button>
    </form>

    <section id="outputSection" style="display: none;">
        <h2>Application Submitted</h2>
        <div id="outputData"></div>
    </section>

    <script src="Script.js" defer></script>
</body>
</html>
